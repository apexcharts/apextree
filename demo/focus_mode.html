<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Focus / Spotlight Mode</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <script src="../apextree.min.js"></script>
    <style>
      body {
        max-width: 1000px;
        margin: 0 auto;
        font-family: 'Inter', sans-serif;
        background: #fff;
        padding: 20px 0;
      }
      h2 {
        font-size: 22px;
        font-weight: 700;
        color: #1a1a2e;
        margin: 0 0 4px 0;
        line-height: 1.3;
      }
      .subtitle {
        font-size: 13px;
        color: #6e6e6e;
        margin-bottom: 16px;
      }
      .controls {
        display: flex;
        gap: 8px;
        margin-bottom: 12px;
      }
      .controls button {
        font: inherit;
        font-size: 12px;
        font-weight: 600;
        padding: 6px 12px;
        border-radius: 6px;
        border: 1px solid #cbd5e1;
        background: #f8fafc;
        cursor: pointer;
      }
      .controls button:hover {
        border-color: #6366f1;
        color: #4338ca;
      }
    </style>
  </head>
  <body>
    <h2>Focus / Spotlight Mode</h2>
    <p class="subtitle">
      Click a node to spotlight its lineage and subtree (<code>focus: { clickToFocus: true }</code>). Click it again,
      press <kbd>Esc</kbd>, or use the button to exit.
    </p>
    <div class="controls">
      <button id="btn-focus-eng">Focus Engineering</button>
      <button id="btn-focus-mia">Focus Mia Torres</button>
      <button id="btn-clear">Clear focus</button>
    </div>
    <div id="svg-tree"></div>
    <script>
      const data = {
        id: 'ceo',
        name: 'Alex Rivera (CEO)',
        children: [
          {
            id: 'engineering',
            name: 'Sam Chen (VP Eng)',
            children: [
              {
                id: 'platform',
                name: 'Mia Torres (Platform Lead)',
                children: [
                  {id: 'platform_1', name: 'Noah Kim'},
                  {id: 'platform_2', name: 'Ella Novak'},
                ],
              },
              {
                id: 'frontend',
                name: 'Leo Haas (Frontend Lead)',
                children: [
                  {id: 'frontend_1', name: 'Ava Moreau'},
                  {id: 'frontend_2', name: 'Raj Patel'},
                ],
              },
            ],
          },
          {
            id: 'sales',
            name: 'Dana Wolfe (VP Sales)',
            children: [
              {id: 'sales_1', name: 'Ben Ortiz'},
              {id: 'sales_2', name: 'Zoe Adler'},
            ],
          },
          {
            id: 'marketing',
            name: 'Iris Novak (VP Marketing)',
            children: [
              {id: 'marketing_1', name: 'Tia Rossi'},
              {id: 'marketing_2', name: 'Kai Weber'},
            ],
          },
        ],
      };

      const options = {
        width: '100%',
        viewPortWidth: 1000,
        viewPortHeight: 640,
        nodeWidth: 150,
        nodeHeight: 46,
        childrenSpacing: 70,
        siblingSpacing: 24,
        direction: 'top',
        edgeStyle: 'curved',
        edgeWidth: 2,
        enableExpandCollapse: true,
        enableToolbar: true,
        focus: {clickToFocus: true, dimOpacity: 0.75},
        canvasStyle: 'border: 1px solid #e0e0e0; border-radius: 8px; background: #fff;',
      };

      const tree = new ApexTree(document.getElementById('svg-tree'), options);
      const graph = tree.render(data);

      document.getElementById('btn-focus-eng').addEventListener('click', () => graph.focus('engineering'));
      document.getElementById('btn-focus-mia').addEventListener('click', () => graph.focus('platform'));
      document.getElementById('btn-clear').addEventListener('click', () => graph.clearFocus());
    </script>
  </body>
</html>
