<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Command Palette (Cmd/Ctrl + K)</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <script src="../apextree.min.js"></script>
    <style>
      body {
        max-width: 1000px;
        margin: 0 auto;
        font-family: 'Inter', sans-serif;
        background: #fff;
        padding: 20px 0;
      }
      h2 {
        font-size: 22px;
        font-weight: 700;
        color: #1a1a2e;
        margin: 0 0 4px 0;
      }
      .subtitle {
        font-size: 13px;
        color: #6e6e6e;
        margin-bottom: 16px;
      }
      kbd {
        background: #f2f4f7;
        border: 1px solid #e4e7ec;
        border-radius: 4px;
        padding: 1px 6px;
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <h2>Command Palette</h2>
    <p class="subtitle">
      Press <kbd>Cmd</kbd>/<kbd>Ctrl</kbd> + <kbd>K</kbd> to open. Type a name to jump to a node, or run
      <em>Expand all</em> / <em>Collapse all</em> / <em>Fit to screen</em>. Arrow keys move, Enter runs, Esc closes.
    </p>
    <div id="svg-tree"></div>
    <script>
      const data = {
        id: 'ceo',
        name: 'Alex Rivera (CEO)',
        children: [
          {
            id: 'engineering',
            name: 'Sam Chen (VP Eng)',
            children: [
              {id: 'platform', name: 'Mia Torres (Platform)'},
              {id: 'frontend', name: 'Leo Haas (Frontend)'},
              {id: 'infra', name: 'Nina Patel (Infra)'},
            ],
          },
          {
            id: 'sales',
            name: 'Dana Wolfe (VP Sales)',
            children: [
              {id: 'emea', name: 'Ben Ortiz (EMEA)'},
              {id: 'amer', name: 'Zoe Adler (AMER)'},
            ],
          },
          {
            id: 'marketing',
            name: 'Iris Novak (VP Marketing)',
            children: [
              {id: 'brand', name: 'Tia Rossi (Brand)'},
              {id: 'growth', name: 'Kai Weber (Growth)'},
            ],
          },
        ],
      };

      const options = {
        width: '100%',
        viewPortWidth: 1000,
        viewPortHeight: 560,
        nodeWidth: 160,
        nodeHeight: 46,
        childrenSpacing: 70,
        siblingSpacing: 22,
        direction: 'top',
        edgeStyle: 'curved',
        edgeWidth: 2,
        enableToolbar: true,
        enableCommandPalette: true,
        canvasStyle: 'border: 1px solid #e0e0e0; border-radius: 8px; background: #fff;',
      };

      const tree = new ApexTree(document.getElementById('svg-tree'), options);
      tree.render(data);
    </script>
  </body>
</html>
